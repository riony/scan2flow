[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2foam"
version = "0.1.0"
description = "Surface-mesh inspection and an experimental geometry-to-OpenFOAM toolkit"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "trimesh>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
prototypes = ["scipy>=1.11", "pyyaml>=6"]

[project.scripts]
scan2foam = "scan2foam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Standard correctness checks and import hygiene, independent of machine settings.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Preserve legacy numerical bodies; unused intermediates and lambda spelling
# remain migration work. Undefined names and syntax errors are still checked.
"prototypes/**/*.py" = ["F841", "E731", "E741"]
